<script>
  // Errors from the very first moment, for the report and ?debug (a phone has no DevTools), and a
  // message on the start screen when the game cannot start at all (old iOS, a CDN that is down):
  // otherwise the button would say "Завантаження…" forever.
  {
    const errs = window.__nocturneErrors = [];
    const t0 = Date.now();
    let panel = null, failed = false;
    const add = (kind, msg) => {
      errs.push({ t: +((Date.now() - t0) / 1000).toFixed(1), kind, msg: String(msg).slice(0, 500) });
      if (errs.length > 30) errs.shift();
      if (panel) panel.textContent = errs.map((e) => `${e.t}s ${e.kind}: ${e.msg}`).join('\n');
      if (!window.__game && kind !== 'console') bootFailed();
    };
    addEventListener('error', (e) => {
      const t = e.target;
      if (t && t !== window && (t.src || t.href)) add('load', /main\.js/.test(t.src) ? 'не завантажились модулі гри (src/main.js або vendor/three)' : `не завантажилось: ${t.src || t.href}`);
      else add('error', `${e.message}${e.filename ? ` @ ${e.filename.split('/').pop().split('?')[0]}:${e.lineno}:${e.colno}` : ''}`);
    }, true);
    addEventListener('unhandledrejection', (e) => add('promise', e.reason && (e.reason.stack || e.reason.message) || e.reason));
    const ce = console.error;
    console.error = (...a) => { add('console', a.map((x) => (x && x.stack) || String(x)).join(' ')); ce.apply(console, a); };

    if (/[?&]debug\b/.test(location.search)) addEventListener('DOMContentLoaded', () => {
      panel = document.createElement('pre');
      panel.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:35vh;overflow:auto;margin:0;z-index:40;background:rgba(40,0,0,.85);color:#ffd0d0;font:11px/1.3 ui-monospace,monospace;padding:6px 8px;white-space:pre-wrap;pointer-events:none';
      panel.textContent = errs.length ? errs.map((e) => `${e.t}s ${e.kind}: ${e.msg}`).join('\n') : 'debug: помилок немає';
      document.body.append(panel);
    });

    // iOS older than 16.4 has no import maps: the game cannot load there
    const ios = /\b(iPhone|iPod|iPad)\b.*? OS (\d+)_(\d+)/.exec(navigator.userAgent);
    const oldIos = ios && (+ios[2] < 16 || (+ios[2] === 16 && +ios[3] < 4));
    if (oldIos) add('device', `iOS ${ios[2]}.${ios[3]}: потрібна iOS 16.4 або новіша`);

    function bootFailed() {
      if (failed) return;
      failed = true;
      const show = () => {
        const btn = document.getElementById('start');
        if (!btn || (window.__game && !oldIos)) return;
        btn.textContent = 'Гра не завантажилась';
        const box = document.createElement('div');
        box.id = 'bootfail';
        box.style.cssText = 'margin-top:12px;padding:10px 12px;border:1px solid #ff5c5c;border-radius:10px;color:#ffd0d0;font-size:14px';
        box.innerHTML = '<b>Гра не завантажилась.</b> ' + (oldIos ? `На цьому iPhone iOS ${ios[2]}.${ios[3]}, а потрібна 16.4 або новіша (Параметри → Загальні → Оновлення ПЗ).`
          : 'Онови сторінку. Якщо не допомогло — натисни «Скопіювати звіт» і встав у чат.') + '<pre style="white-space:pre-wrap;font:11px/1.3 ui-monospace,monospace;margin:8px 0"></pre>';
        const copy = document.createElement('button');
        copy.textContent = 'Скопіювати звіт';
        copy.addEventListener('click', () => {
          const text = JSON.stringify({ report: 'nocturne-boot', time: new Date().toISOString(), url: location.pathname + location.search, ua: navigator.userAgent, errors: errs }, null, 1);
          const done = (ok) => { copy.textContent = ok ? 'Скопійовано' : 'Не вдалося — виділи текст вище'; };
          try { navigator.clipboard.writeText(text).then(() => done(true), () => done(false)); } catch { done(false); }
        });
        box.querySelector('pre').textContent = errs.map((e) => `${e.t}s ${e.kind}: ${e.msg}`).join('\n');
        box.append(copy);
        document.getElementById('buttons').after(box);
      };
      if (document.readyState === 'loading') addEventListener('DOMContentLoaded', show); else show();
    }
    // nothing broke loudly but the game is still not there after 25 s
    setTimeout(() => { if (!window.__game) { add('boot', 'гра не запустилась за 25 с'); } }, 25000);
  }
</script>

<script>
  // Stale-cache guard for the Quest browser: if a newer build is deployed than this (possibly
  // cached) page, reload once with ?v=<new>, a URL no cache has seen. Every module URL carries
  // ?v=<version> too (import map above). Versions are set by tools/bump-version.mjs.
  {
    const PAGE_VERSION = '0.6.0-pre.9.net.1';
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then((r) => r.json()).then(({ version }) => {
      const url = new URL(location.href);
      if (version && version !== PAGE_VERSION && url.searchParams.get('v') !== version) {
        url.searchParams.set('v', version);
        location.replace(url.href);
      }
    }).catch(() => {});
  }
